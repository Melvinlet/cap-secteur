<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cap Secteur</title>
  <meta name="description" content="Tournées, fiches magasins, rendez-vous et commandes du chef de secteur.">
  <meta name="theme-color" content="#1E4FA0">

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

</head>
<body>
  <!-- animation d'ouverture (une fois par lancement) : jouée par js/ouverture.js, l'appli se charge derrière -->
  <div id="ouverture" aria-hidden="true" hidden>
    <svg viewBox="0 0 512 512">
  
      <g id="ov-roule">
        <!-- traits de vitesse (derrière la borne, à gauche) -->
        <g id="ov-vitesses" stroke-linecap="round">
          <line class="vitesse" x1="10"  y1="180" x2="150" y2="180" stroke="#F2C230" stroke-width="12"/>
          <line class="vitesse" x1="-20" y1="236" x2="140" y2="236" stroke="#ffffff" stroke-width="10" stroke-opacity=".85"/>
          <line class="vitesse" x1="30"  y1="300" x2="150" y2="300" stroke="#F2C230" stroke-width="10"/>
          <line class="vitesse" x1="0"   y1="360" x2="130" y2="360" stroke="#ffffff" stroke-width="8" stroke-opacity=".7"/>
        </g>
        <ellipse id="ov-ombre" cx="256" cy="432" rx="104" ry="11" fill="#0B1F45" opacity=".35"/>
        <g id="ov-freine"><g id="ov-cabre">
          <g id="ov-corps"><g transform="translate(256 268)">
            <path d="M-92 150 V-8 H92 V150 Z" fill="#fff" stroke="#18202C" stroke-width="14" stroke-linejoin="round"/>
            <rect x="-52" y="44" width="104" height="14" rx="7" fill="#C9D3E3"/>
            <rect x="-52" y="80" width="70" height="14" rx="7" fill="#C9D3E3"/>
          </g></g>
          <g id="ov-chapeau"><g transform="translate(256 268)">
            <path d="M-92 -8 V-70 A92 92 0 0 1 92 -70 V-8 Z" fill="#F2C230" stroke="#18202C" stroke-width="14" stroke-linejoin="round"/>
            <path d="M-44 -44 L44 -44 M18 -66 L44 -44 L18 -22" fill="none" stroke="#18202C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </g></g>
          <!-- éclair du « clac » sur la jointure -->
          <line id="ov-clip" x1="164" y1="260" x2="348" y2="260" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
        </g></g>
      </g>
    </svg>
  </div>
  <script src="js/ouverture.js"></script>
  <a class="skip" href="#main">Aller au contenu</a>
  <div class="shell">
    <nav class="nav" aria-label="Navigation principale">
      <a class="brand" href="#/">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <span>Cap Secteur</span>
      </a>
      <a href="#/" data-route="aujourdhui"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5v-5h-6v5H4z"/></svg><span>Aujourd'hui</span></a>
      <a href="#/tournee" data-route="tournee"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h6" fill="none"/></svg><span>Planning</span></a>
      <a href="#/rdv" data-route="rdv"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="1.5" fill="none"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4M9 15l2 2 4-4" fill="none"/></svg><span>RDV</span></a>
      <a href="#/magasins" data-route="magasins"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 5 4h14l2 5.5M4 10v10h16V10M9 20v-5h6v5" fill="none"/></svg><span>Magasins</span></a>
      <a href="#/activite" data-route="activite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3" fill="none"/></svg><span>Activité</span></a>
      <a href="#/reglages" data-route="reglages" class="nav-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" fill="none"/></svg><span>Réglages</span></a>
      <div class="nav-status" id="netStatus" hidden>Hors connexion</div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <noscript>Cap Secteur a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
